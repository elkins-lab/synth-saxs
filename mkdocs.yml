site_name: synth-saxs
site_url: https://elkins.github.io/synth-saxs
repo_url: https://github.com/elkins/synth-saxs
repo_name: elkins/synth-saxs
site_description: Lightweight SAXS profile simulation from protein coordinates
site_author: George Elkins

theme:
  name: material
  palette: 
    scheme: default
    primary: deep purple
    accent: indigo

nav:
  - Home: index.md
  - API Reference: api.md
  - Science: science.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          setup_commands:
            - import sys
            - sys.path.append(".")
