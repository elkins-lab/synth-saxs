name: Bug Report
description: Create a report to help us improve synth-saxs.
title: "[BUG] "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and fix the bug.

        **Note:** If this is a security vulnerability, please refer to our [Security Policy](https://github.com/elkins/synth-saxs/blob/main/SECURITY.md) and report it privately.

  - type: input
    id: version
    attributes:
      label: synth-saxs version
      description: What version of synth-saxs are you using? (e.g., 0.1.3)
      placeholder: "0.1.3"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: What version of Python are you using? (e.g., 3.10, 3.12)
      placeholder: "3.12"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: |
        Please provide a minimal, reproducible example (MRE) if possible.
        Code snippets or a link to a repository/gist are highly encouraged.
      placeholder: |
        1. Load structure '...'
        2. Call `calculate_saxs_profile(...)`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Information about your operating system and environment (e.g., macOS, Ubuntu, Windows, Conda, venv).
    validations:
      required: false
